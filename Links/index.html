<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --roxo:        #3D1058;
      --lilas:       #9B72CF;
      --lilas-claro: #C4A8E8;
      --creme:       #F5EFE6;
      --creme2:      #EDE5D8;
      --dourado:     #E8A820;
      --texto:       #2A0A45;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      color: var(--texto);
      overflow-x: hidden;
      background: var(--creme);
    }

    /* ── FUNDO (substitua pelo url da sua imagem) ── */
    .bg-image {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: var(--creme);
      /* background-image: url('fundo.jpg'); background-size: cover; background-position: center; */
    }
    .bg-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(245,239,230,0.70);
    }

    /* ── CANVAS DE PARTÍCULAS ── */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* ── WRAPPER ── */
    .wrapper {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 64px;
    }

    /* ── HERO / LOGO ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 36px;
      animation: fadeDown 0.8s ease both;
    }

    .logo-wrap {
      width: 180px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Placeholder — troque por <img src="logo.png" class="logo-img" alt="Açaí do Beni"> */
    .logo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--lilas-claro);
      border-radius: 16px;
      color: var(--lilas);
      font-size: 11px;
      letter-spacing: 1px;
      gap: 6px;
      text-align: center;
      padding: 8px;
    }
    .logo-placeholder .ph-icon { font-size: 26px; opacity: 0.5; }
    .logo-img { max-width: 180px; max-height: 120px; object-fit: contain; }

    .tagline {
      font-size: 12px;
      font-weight: 400;
      color: var(--lilas);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-align: center;
    }

    .rainbow-bar {
      width: 70px; height: 3px; border-radius: 4px;
      background: linear-gradient(90deg, #5B8CEE, #E84040, #E8A820, #4CAF50, #9B72CF);
      margin-top: 4px;
      animation: fadeUp 1s 0.4s ease both;
    }

    /* ── CARDS ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 400px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
      border-radius: 20px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border: none;
      transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s ease;
    }
    .link-card:hover { transform: translateY(-3px) scale(1.02); }
    .link-card::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      opacity: 0; transition: opacity 0.22s; background: rgba(255,255,255,0.10);
    }
    .link-card:hover::before { opacity: 1; }

    .card-whats { background: var(--roxo); box-shadow: 0 6px 28px rgba(61,16,88,0.30); }
    .card-whats:hover { box-shadow: 0 14px 40px rgba(61,16,88,0.42); }

    /* Instagram — roxo escuro sólido */
    .card-insta { background: #5A2080; box-shadow: 0 6px 28px rgba(90,32,128,0.30); }
    .card-insta:hover { box-shadow: 0 14px 40px rgba(90,32,128,0.45); }

    .card-menu { background: #fff; border: 2px solid var(--lilas-claro); box-shadow: 0 4px 20px rgba(155,114,207,0.14); }
    .card-menu:hover { box-shadow: 0 12px 36px rgba(155,114,207,0.24); border-color: var(--lilas); }

    .card-icon {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .card-whats .card-icon, .card-insta .card-icon { background: rgba(255,255,255,0.15); }
    .card-menu  .card-icon { background: var(--creme2); }

    .card-text { flex: 1; }
    .card-title { font-weight: 500; font-size: 16px; line-height: 1.2; }
    .card-sub   { font-size: 12px; font-weight: 300; opacity: 0.75; margin-top: 2px; }

    .card-whats .card-title, .card-whats .card-sub,
    .card-insta .card-title, .card-insta .card-sub { color: #fff; }
    .card-menu  .card-title { color: var(--roxo); }
    .card-menu  .card-sub   { color: var(--lilas); }

    .card-arrow { font-size: 20px; opacity: 0.6; flex-shrink: 0; transition: transform 0.2s; }
    .link-card:hover .card-arrow { transform: translateX(4px); opacity: 1; }
    .card-whats .card-arrow, .card-insta .card-arrow { color: #fff; }
    .card-menu  .card-arrow { color: var(--lilas); }

    .badge-soon {
      display: inline-block; font-size: 10px; font-weight: 500;
      letter-spacing: 1px; text-transform: uppercase;
      background: var(--lilas-claro); color: var(--roxo);
      border-radius: 20px; padding: 2px 8px; margin-top: 4px;
    }

    /* ── BERRIES DECORATIVAS (imagens substituíveis) ── */
    .berries {
      display: flex; gap: 12px; margin: 32px 0 8px;
      align-items: flex-end;
      animation: fadeUp 1s 0.7s ease both;
    }
    .berry { display: block; object-fit: contain; }
    .berry:nth-child(1) { width: 36px; height: 36px; animation: floatB 3.2s ease-in-out infinite; }
    .berry:nth-child(2) { width: 26px; height: 26px; animation: floatB 3.8s ease-in-out infinite 0.5s; }
    .berry:nth-child(3) { width: 34px; height: 34px; animation: floatB 3.0s ease-in-out infinite 1.0s; }
    .berry:nth-child(4) { width: 28px; height: 28px; animation: floatB 4.2s ease-in-out infinite 0.3s; }
    .berry:nth-child(5) { width: 22px; height: 22px; animation: floatB 3.5s ease-in-out infinite 0.8s; }
    @keyframes floatB {
      0%,100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-10px) rotate(3deg); }
    }

    /* ── RODAPÉ ── */
    .footer {
      margin-top: 28px; text-align: center;
      font-size: 12px; color: var(--lilas); font-weight: 300; letter-spacing: 0.5px;
      animation: fadeUp 1s 0.9s ease both;
    }
    .footer strong { color: var(--roxo); font-weight: 500; }

    /* ── ANIMAÇÕES ── */
    @keyframes fadeDown { from { opacity:0; transform:translateY(-24px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY( 24px); } to { opacity:1; transform:translateY(0); } }

    .links .link-card:nth-child(1) { animation: fadeUp 0.7s 0.35s ease both; }
    .links .link-card:nth-child(2) { animation: fadeUp 0.7s 0.50s ease both; }
    .links .link-card:nth-child(3) { animation: fadeUp 0.7s 0.65s ease both; }

    .ripple {
      position: absolute; border-radius: 50%; background: rgba(255,255,255,0.25);
      transform: scale(0); animation: ripple-anim 0.55s linear; pointer-events: none;
    }
    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

    @media (max-width: 380px) {
      .wrapper { padding: 36px 16px 52px; }
      .link-card { padding: 16px 18px; }
    }
  </style>
</head>

  <script>
    /* ── PARTÍCULAS: bolinhas de açaí subindo ── */
    const canvas = document.getElementById('particles');
    const ctx    = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Paleta de cores das bolinhas (tons roxo/berinjela do açaí)
    const COLORS = [
      'rgba(61,16,88,',    // roxo escuro
      'rgba(90,26,128,',   // roxo médio
      'rgba(42,10,69,',    // berinjela
      'rgba(155,114,207,', // lilás
      'rgba(61,16,88,',
    ];

    // Cria partículas
    const TOTAL = 38;
    const particles = Array.from({ length: TOTAL }, () => spawn(true));

    function spawn(randomY) {
      const r = Math.random() * 3.5 + 2;       // raio 2–5.5px
      return {
        x:       Math.random() * W,
        y:       randomY ? Math.random() * H : H + r + 10,
        r,
        speed:   Math.random() * 0.5 + 0.2,    // velocidade lenta
        drift:   (Math.random() - 0.5) * 0.3,  // leve deriva lateral
        opacity: Math.random() * 0.10 + 0.03,  // 3–13% — bem sutis
        color:   COLORS[Math.floor(Math.random() * COLORS.length)],
        phase:   Math.random() * Math.PI * 2,   // fase para wiggle
      };
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const t = performance.now() / 1000;

      particles.forEach((p, i) => {
        // sobe
        p.y -= p.speed;
        // wiggle horizontal suave
        p.x += Math.sin(t * 0.6 + p.phase) * 0.25 + p.drift;

        // reinicia quando sai pelo topo
        if (p.y < -p.r * 2) {
          particles[i] = spawn(false);
          return;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color + p.opacity + ')';
        ctx.fill();
      });

      requestAnimationFrame(draw);
    }

    draw();

    /* ── RIPPLE nos cards ── */
    document.querySelectorAll('.link-card').forEach(card => {
      card.addEventListener('click', function(e) {
        const r    = document.createElement('span');
        r.classList.add('ripple');
        const rect = this.getBoundingClientRect();
        const s    = Math.max(rect.width, rect.height);
        r.style.width = r.style.height = s + 'px';
        r.style.left  = (e.clientX - rect.left  - s/2) + 'px';
        r.style.top   = (e.clientY - rect.top   - s/2) + 'px';
        this.appendChild(r);
        setTimeout(() => r.remove(), 600);
      });
    });
  </script>
